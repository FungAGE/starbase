name: Build and publish Docker images to ghcr.io

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Frontend image keeps the existing name for SciLifeLab Serve compatibility
  FRONTEND_IMAGE: ${{ github.repository }}
  BACKEND_IMAGE: ${{ github.repository }}-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Log in to ghcr.io
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # ── Frontend ────────────────────────────────────────────────────────────

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='Europe/Stockholm'}}
            # SciLifeLab Serve requires unique tags; latest disabled intentionally
            # type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            MAINTENANCE_TOKEN=${{ secrets.MAINTENANCE_TOKEN }}
            IPSTACK_API_KEY=${{ secrets.IPSTACK_API_KEY }}

      # ── Backend ─────────────────────────────────────────────────────────────

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='Europe/Stockholm'}}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            MAINTENANCE_TOKEN=${{ secrets.MAINTENANCE_TOKEN }}
            IPSTACK_API_KEY=${{ secrets.IPSTACK_API_KEY }}

      # ── Cleanup (keep last 5 versions of each) ──────────────────────────────

      - name: Remove old frontend packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: 5

      - name: Remove old backend packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}-backend
          package-type: container
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: 5
