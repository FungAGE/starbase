name: Build and publish Docker images to ghcr.io

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Frontend image keeps the existing name for SciLifeLab Serve compatibility
  FRONTEND_IMAGE: ${{ github.repository }}
  BACKEND_IMAGE: ${{ github.repository }}-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Log in to ghcr.io
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # ── Frontend ────────────────────────────────────────────────────────────

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='Europe/Stockholm'}}
            # SciLifeLab Serve requires unique tags; latest disabled intentionally
            # type=raw,value=latest

      - name: Build frontend image (local, for smoke test)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: smoke-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Smoke test frontend image
        run: |
          docker run -d --name smoke-frontend -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-test \
            -e BACKEND_API_URL=http://127.0.0.1:1 \
            -e BACKEND_API_KEY=ci-smoke-test \
            smoke-frontend:test --dev

          ok=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/cache/status > /dev/null; then
              echo "frontend healthy"
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != "true" ]; then
            echo "::error::frontend image failed to become healthy"
            docker logs smoke-frontend
            docker rm -f smoke-frontend
            exit 1
          fi
          docker rm -f smoke-frontend

      - name: Push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # ── Backend ─────────────────────────────────────────────────────────────
      #
      # Same rule: no secret build-args. MAINTENANCE_TOKEN / IPSTACK_API_KEY /
      # BACKEND_API_KEY are runtime-only.

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='Europe/Stockholm'}}

      - name: Build backend image (local, for smoke test)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: smoke-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Smoke test backend image
        run: |
          mkdir -p /tmp/smoke-db
          chmod 777 /tmp/smoke-db
          docker run -d --name smoke-backend -p 8001:8001 \
            -e BACKEND_API_KEY=ci-smoke-test \
            -v /tmp/smoke-db:/home/starbase/src/database/db \
            smoke-backend:test

          ok=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null; then
              echo "backend healthy"
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != "true" ]; then
            echo "::error::backend image failed to become healthy"
            docker logs smoke-backend
            docker rm -f smoke-backend
            exit 1
          fi
          docker rm -f smoke-backend

      - name: Push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ── Cleanup (keep last 5 versions of each) ──────────────────────────────

      - name: Remove old frontend packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: 5

      - name: Remove old backend packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}-backend
          package-type: container
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: 5
