# Starbase compute backend conda environment.
#
# Build: mamba env create -f backend/environment.yaml
# Update: mamba env update -f backend/environment.yaml --prune
#
# NOTE: build strings omitted intentionally; conda/mamba resolves platform-specific builds.
# When locking for production, run: conda env export > backend/environment.lock.yaml

name: starbase-backend
channels:
  - bioconda
  - conda-forge
dependencies:
  # ── Python runtime ──────────────────────────────────────────────────────────
  - python=3.11

  # ── Dash dependencies ────────────────────────────────────────────────────────
  - dash==2.16.1
  - dash-ag-grid
  - dash-bio==1.0.2
  - dash-bootstrap-components==1.5.0
  - dash-core-components==2.0.0
  - dash-html-components==2.0.0
  - dash-iconify==0.1.2
  - dash-mantine-components==0.14.4
  - dash-table==5.0.0

  # ── Bioinformatics executables (conda-managed; no pip equivalent) ───────────
  - blast=2.16.0
  - hmmer=3.4
  - diamond=2.1.13
  - minimap2=2.30
  - mmseqs2=17.b804f
  - clustalw=2.1
  - mcl=22.282
  - rpsbproc=0.5.0
  - entrez-direct=22.4
  - k8=1.2

  # ── Bio Python libraries (conda versions pin C-extension builds) ─────────────
  - biopython=1.85
  - bcbio-gff=0.7.1
  - gffutils=0.13
  - pyfaidx=0.8.2
  - bx-python=0.14.0
  - pyvcf3=1.0.4
  - screed=1.1.3
  - sourmash=4.8.4
  - sourmash-minimal=4.8.4
  - clinker-py=0.0.31

  # ── Numerical / data science (C-ext builds) ─────────────────────────────────
  - numpy=1.26.4
  - pandas=2.0.3
  - scipy=1.11.2
  - scikit-learn=1.6.1
  - matplotlib
  - pillow=11.3.0
  - networkx=3.2.1

  # ── System/runtime ──────────────────────────────────────────────────────────
  - curl
  - wget
  - openssl
  - ca-certificates
  - gawk=5.3.1
  - perl=5.32.1
  - perl-archive-tar
  - perl-compress-raw-bzip2
  - perl-compress-raw-zlib
  - perl-io-compress
  - perl-io-zlib
  - perl-json
  - perl-json-xs

  # ── Pip packages ────────────────────────────────────────────────────────────
  - pip:
      # FastAPI server stack
      - fastapi==0.116.1
      - uvicorn==0.33.0
      - starlette>=0.41
      - pydantic>=2.0,<3
      - h11==0.16.0
      - sniffio==1.3.1
      - anyio>=3.4

      # SQLAlchemy + Alembic (DB access + migrations)
      - sqlalchemy==1.4.36
      - alembic==1.16.5
      - greenlet==3.2.4
      - mako==1.3.10

      # Celery + broker/backend
      - celery==5.3.1
      - kombu==5.5.4
      - amqp==5.3.1
      - billiard==4.2.1
      - vine==5.1.0
      - redis==5.0.8
      - click==8.1.8
      - click-didyoumean==0.3.1
      - click-plugins==1.1.1.2
      - click-repl==0.3.0
      - async-timeout==5.0.1

      # In-process query cache (sql_manager_impl)
      - cachetools==4.2.4

      # smart_cache decorator (sql_manager.py facade, seq_utils.py) — filesystem
      # cache backend, no running Flask app required
      - flask==2.2.5
      - flask-caching==2.3.0

      # Retry + resilience
      - tenacity==8.2.3
      - retrying==1.4.2

      # Telemetry / geolocation
      - geocoder==1.38.1
      - geoip2==5.1.0
      - maxminddb==2.8.2
      - ip2geotools==0.1.6
      - ip2location==8.10.5
      - geoparse==2.0.4
      - ratelim==0.1.6

      # HTTP / async I/O
      - requests==2.32.3
      - aiohttp==3.12.15
      - aiohappyeyeballs==2.6.1
      - aiosignal==1.4.0
      - frozenlist==1.7.0
      - multidict==6.6.4
      - yarl==1.20.1
      - propcache==0.3.2
      - httpx>=0.27

      # Data / serialisation
      - simplejson==3.20.1
      - pyyaml==6.0.2
      - lxml==6.0.0
      - plotly==5.24.1
      - pygenomeviz==1.5.0
      - logomaker==0.8

      # Utilities
      - python-dotenv==1.0.1
      - schedule==1.2.1
      - psutil==5.9.5
      - rich==13.9.4
      - tqdm==4.67.1
      - packaging==24.2
      - cryptography==45.0.6
      - six==1.17.0
      - pytz==2025.2
      - python-dateutil==2.9.0.post0
      - sortedcontainers==2.4.0
      - tblib==3.1.0
      - joblib==1.5.1
      - threadpoolctl==3.6.0
      - disjoint-set==0.8.0
      - ordered-set==4.1.0
      - more-itertools==10.7.0
      - attrs==25.3.0
      - exceptiongroup==1.3.0
      - typing==3.7.4.3
      - typing-extensions==4.14.1
      - importlib-metadata==8.7.0
      - zipp==3.23.0
      - rpds-py==0.27.0
      - referencing==0.36.2
      - jsonschema==4.25.0
      - jsonschema-specifications==2025.4.1
      - urllib3==2.6.3
      - charset-normalizer==3.4.3
      - idna==3.10
      - certifi==2025.8.3
      - outcome==1.3.0.post0

      # Testing
      - pytest==7.1.2
      - pluggy==1.6.0
      - iniconfig==2.1.0
