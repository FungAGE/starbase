# Starbase compute backend — production deployment on institute machine.
#
# This compose file uses a pre-built image from GHCR.
# Build + push happens via .github/workflows/docker-image.yml on push to main.
#
# Usage:
#   export BACKEND_IMAGE=ghcr.io/<org>/starbase-backend:<timestamp-tag>
#   docker compose -f backend/docker-compose.yaml pull
#   docker compose -f backend/docker-compose.yaml up -d
#
# Required env vars (.env in repo root or exported):
#   BACKEND_IMAGE     - full GHCR image reference, e.g. ghcr.io/fungagelab/starbase-backend:20260518-120000
#   BACKEND_API_KEY   - shared secret; frontend sends as X-API-Key header
#   DATA_DIR          - absolute host path containing starbase.sqlite + BLAST dirs
#
# Optional:
#   IPSTACK_API_KEY, MAINTENANCE_TOKEN
#   BACKEND_PORT      - default 8001
#   UVICORN_WORKERS   - default 4

services:

  redis:
    image: redis:7-alpine
    container_name: starbase_backend_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: starbase_backend
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
    environment:
      - PYTHONPATH=/home/starbase
      - PYTHONNOUSERSITE=1
      - PYTHONUNBUFFERED=1
      - SQLALCHEMY_WARN_20=1
      - SQLALCHEMY_SILENCE_UBER_WARNING=1
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_PORT=${BACKEND_PORT:-8001}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - IPSTACK_API_KEY=${IPSTACK_API_KEY:-}
      - MAINTENANCE_TOKEN=${MAINTENANCE_TOKEN:-}
    volumes:
      - ${DATA_DIR}:/home/starbase/src/database/db:rw
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${BACKEND_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  celery-worker:
    image: ${BACKEND_IMAGE}
    container_name: starbase_backend_celery_worker
    environment:
      - PYTHONPATH=/home/starbase
      - PYTHONNOUSERSITE=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - IPSTACK_API_KEY=${IPSTACK_API_KEY:-}
    volumes:
      - ${DATA_DIR}:/home/starbase/src/database/db:rw
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["python"]
    command: ["manage_celery.py", "worker"]
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  celery-beat:
    image: ${BACKEND_IMAGE}
    container_name: starbase_backend_celery_beat
    environment:
      - PYTHONPATH=/home/starbase
      - PYTHONNOUSERSITE=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BACKEND_API_KEY=${BACKEND_API_KEY}
    volumes:
      - ${DATA_DIR}:/home/starbase/src/database/db:rw
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["python"]
    command: ["manage_celery.py", "beat"]
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: starbase_backend_network
